<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#211D28"><title>Scratch Card | BlazeBet</title><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#211D28;color:#f4f2f7;font-family:'Segoe UI',system-ui,sans-serif}header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#2b2633;position:sticky;top:0}header a{color:#c9c2d6;text-decoration:none;font-weight:600}.logo{font-weight:800;letter-spacing:.5px}.logo b{color:#ffb02e}main{max-width:560px;margin:0 auto;padding:18px 14px 40px}h1{font-size:22px;margin:6px 0 2px}.sub{color:#a89fb8;font-size:13px;margin-bottom:14px}.panel{background:#2b2633;border-radius:14px;padding:16px;margin-bottom:14px}.bal{font-size:14px;color:#a89fb8}.bal b{color:#ffb02e;font-size:20px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{background:#3a3444;color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}.chip.on{background:#ffb02e;color:#211D28}input[type=number]{background:#1d1924;color:#fff;border:1px solid #453e55;border-radius:10px;padding:10px;width:110px;font-size:16px}button.bet{background:#22c55e;color:#06280f;border:0;border-radius:12px;padding:13px 22px;font-size:16px;font-weight:800;cursor:pointer;width:100%}button.ghost{background:#3a3444;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}.stage{background:#1d1924;border-radius:14px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:10px}.big{font-size:52px;font-weight:800}.msg{font-size:16px;min-height:22px}.win{color:#4ade80}.lose{color:#f87171}.grid{display:grid;gap:6px}.cell{background:#3a3444;border:0;color:#fff;border-radius:10px;padding:12px 0;font-weight:700;cursor:pointer;font-size:16px}.cell.sel{background:#ffb02e;color:#211D28}.cell.hit{background:#22c55e}.cell.miss{background:#7f1d1d}.foot{color:#8d84a0;font-size:12px;text-align:center;margin-top:16px}select{background:#1d1924;color:#fff;border:1px solid #453e55;border-radius:10px;padding:10px;font-size:15px}</style><style>body{background:linear-gradient(rgba(5,7,13,.90),rgba(5,7,13,.96)),url('/casino-img/scratch.jpg') center/cover fixed no-repeat,#07090f}.bb-hero{height:170px;border-radius:14px;background:url('/casino-img/scratch.jpg') center/cover;border:1px solid #26314d;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}</style></head>
<body><header><a href="/gh/casino/index.html">&larr; Casino</a><span class="logo">BLIZ<b>BET</b></span></header>
<main><h1>Scratch Card</h1><p class="sub">Scratch all 6 panels. Three matching symbols win that symbol's prize.</p>
<div class="panel row" style="justify-content:space-between"><span class="bal">Demo balance<br><b id="bal">GH₵ 1,000.00</b></span><span class="row"><input type="number" id="stake" value="10" min="1" step="1"><button class="chip" data-v="1">1</button><button class="chip" data-v="5">5</button><button class="chip" data-v="10">10</button><button class="chip" data-v="50">50</button><button class="chip" data-v="100">100</button></span></div>
<div class="panel"><div class="grid" id="card" style="grid-template-columns:repeat(3,1fr)"></div><div class="msg" id="msg" style="margin-top:10px">Buy a card, then tap panels to scratch.</div></div>
<button class="bet" onclick="buy()">BUY CARD &amp; SCRATCH</button>
<p class="foot">Demo game - plays with fun balance only, no real-money wagering on this static preview. Random outcomes generated in your browser.</p></main>
<script>
let bal=1000;const $=id=>document.getElementById(id);
function money(n){return 'GH₵ '+n.toFixed(2)}
function render(){$('bal').textContent=money(bal)}
function getStake(){const s=parseFloat($('stake').value)||0;if(s<=0||s>bal){say('Enter a stake within your demo balance.','lose');return 0}return s}
function settle(stake,mult,winMsg,loseMsg){if(mult>0){const w=stake*mult;bal+=w-stake;say(winMsg+' You won '+money(w)+'.','win')}else{bal-=stake;say(loseMsg,'lose')}render()}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('stake').value=c.dataset.v});
function say(t,c){const m=$('msg');if(m){m.textContent=t;m.className='msg '+(c||'')}}
render();
const sym=['\u{1F352}','\u{1F34B}','\u2B50','\u{1F48E}','\u{1F514}','\u{1F340}'];const pay={'\u{1F352}':3,'\u{1F34B}':3,'\u2B50':5,'\u{1F48E}':15,'\u{1F514}':8,'\u{1F340}':4};
let cells=[],open=0,stake0=0;
function buy(){const s=getStake();if(!s)return;stake0=s;open=0;const win=sym[Math.floor(Math.random()*sym.length)];cells=Array(6).fill(null).map(()=>sym[Math.floor(Math.random()*sym.length)]);
if(Math.random()<0.45){let placed=0;while(placed<3){const i=Math.floor(Math.random()*6);if(cells[i]!=win){cells[i]=win;placed++}}}
const cd=$('card');cd.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.style.fontSize='30px';b.textContent='?';b.onclick=()=>{if(b.dataset.done)return;b.dataset.done=1;b.textContent=v;open++;if(open==6)finish()};cd.appendChild(b)});say('Scratching... tap all 6 panels.','')}
function finish(){const cnt={};cells.forEach(v=>cnt[v]=(cnt[v]||0)+1);const hit=Object.keys(cnt).find(k=>cnt[k]>=3);
if(hit)settle(stake0,pay[hit],'Three '+hit+' - prize '+pay[hit]+'x!','');else{bal-=stake0;say('No three of a kind on this card.','lose');render()}}
</script></body></html>
