<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Coin Flip — BlazeBet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/game-kit.css">
<style>
.coin-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 12px 10px;gap:10px}
.coin{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffe98a, #f5c542 60%, #c9930a);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#7c4a03;box-shadow:0 14px 30px #0007,inset 0 0 0 6px #c9930a;transform-style:preserve-3d}
.coin.flip{animation:cflip .9s ease}
@keyframes cflip{0%{transform:rotateX(0)}100%{transform:rotateX(1440deg)}}
.coin img{width:74px;height:74px;object-fit:contain}
.picks{display:flex;gap:8px;justify-content:center;padding-bottom:16px}
.pick{border:2px solid #ffffff38;background:#ffffff14;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer}
.pick.on{border-color:#f5c542;background:#f5c542;color:#0a1f44}</style>
</head>
<body>
<header class="gk-head"><a class="gk-back" href="/gh/casino/">&larr; Casino</a><span class="gk-logo">BLAZE<b>BET</b></span><span class="gk-bal">GH&#8373; <b id="gkBal">0.00</b></span></header>
<main class="gk-main">
  <h1>Gold Coin Flip</h1>
  <p class="gk-sub">A gold sovereign — call the flip.</p>
  <section class="gk-stage" id="stage" style="background:linear-gradient(160deg, #854d0e, #422006)"><div class="coin-wrap"><div class="coin" id="coin">K</div></div><div class="picks"><button class="pick on" id="pickA" type="button">CROWN</button><button class="pick" id="pickB" type="button">SHIELD</button></div></section>
  <section class="gk-panel">
    <div class="gk-label">Your stake (GH&#8373;)</div>
    <div class="gk-stake-row">
      <input id="gkStake" type="number" value="10" min="1" step="1" inputmode="decimal">
      <button class="gk-chip" data-chip="1">1</button><button class="gk-chip" data-chip="5">5</button>
      <button class="gk-chip" data-chip="10">10</button><button class="gk-chip" data-chip="50">50</button>
      <button class="gk-chip" data-chip="100">100</button>
      <button class="gk-chip" id="gkHalf">&frac12;</button><button class="gk-chip" id="gkDouble">2&times;</button>
    </div>
    
    <div class="gk-msg" id="gkMsg">Call the flip — pays ×1.92.</div>
    <button class="gk-bet" id="gkAction">FLIP COIN</button>
    <button class="gk-reset" id="gkReset">Top up demo balance to GH&#8373;1,000</button>
    <div class="gk-history" id="gkHistory"></div>
  </section>
  <p class="gk-foot">Demo game &mdash; plays with fun balance only, no real-money wagering on this static preview. Outcomes are generated in your browser.</p>
</main>
<script src="/game-kit.js"></script>
<script>

(function () {
  var pick = "A", busy = false;
  var coin = document.getElementById("coin"), btn = document.getElementById("gkAction");
  var pa = document.getElementById("pickA"), pb = document.getElementById("pickB");
  pa.addEventListener("click", function () { if (busy) return; pick = "A"; pa.classList.add("on"); pb.classList.remove("on"); });
  pb.addEventListener("click", function () { if (busy) return; pick = "B"; pb.classList.add("on"); pa.classList.remove("on"); });
  btn.addEventListener("click", function () {
    if (busy) return;
    var stake = BB.placeBet(); if (!stake) return;
    busy = true; btn.disabled = true;
    var result = BB.rand(2) === 0 ? "A" : "B";
    coin.classList.remove("flip"); void coin.offsetWidth; coin.classList.add("flip");
    setTimeout(function () {
      coin.innerHTML = result === "A" ? "K" : "S";
      var win = BB.settle(stake, result === pick ? 1.92 : 0);
      if (result === pick) { BB.msg((result === "A" ? "CROWN" : "SHIELD") + "! You called it \u2014 won GH\u20B5" + BB.fmt(win) + ".", "win"); BB.history("\u00D71.92 +" + BB.fmt(win - stake), "w"); }
      else { BB.msg((result === "A" ? "CROWN" : "SHIELD") + " \u2014 your call misses.", "lose"); BB.history("-" + BB.fmt(stake), "l"); }
      busy = false; btn.disabled = false; BB.render();
    }, 920);
  });
})();
</script>
</body>
</html>
