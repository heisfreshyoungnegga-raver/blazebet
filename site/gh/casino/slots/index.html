<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slots 777 — BlazeBet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/game-kit.css">
<style>
.cabinet{background:linear-gradient(180deg,#0d3573,#082550);border:1px solid #ffffff1f;border-radius:18px;padding:18px 14px;box-shadow:inset 0 0 60px #04122e80;width:100%}
.reels{display:flex;gap:10px;justify-content:center}
.reel{width:96px;height:112px;background:#fdfdf8;border-radius:14px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 3px #0a2c5c,inset 0 14px 18px -10px #04122e66,inset 0 -14px 18px -10px #04122e66}
.reel .strip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center}
.reel .strip img{width:88px;height:112px;object-fit:contain;padding:10px}
.reel.win{box-shadow:inset 0 0 0 3px #facc15,0 0 26px #facc1580}
.paytable{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:12px;color:#9db9dd;width:100%}
.paytable b{color:#dbeafe}
.paytable img{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px}
</style>
</head>
<body>
<header class="gk-head"><a class="gk-back" href="/gh/casino/">&larr; Casino</a><span class="gk-logo">BLAZE<b>BET</b></span><span class="gk-bal">GH&#8373; <b id="gkBal">0.00</b></span></header>
<main class="gk-main">
  <h1>Slots 777</h1>
  <p class="gk-sub">Three reels, one payline. Match three for the big pays &mdash; any pair returns &times;1.85.</p>

  <section class="gk-stage" id="stage">
    <div class="cabinet"><div class="reels" id="reels"></div></div>
    <div class="paytable" id="paytable"></div>
  </section>

  <section class="gk-panel">
    <div class="gk-label">Your stake (GH&#8373;)</div>
    <div class="gk-stake-row">
      <input id="gkStake" type="number" value="10" min="1" step="1" inputmode="decimal">
      <button class="gk-chip" data-chip="1">1</button><button class="gk-chip" data-chip="5">5</button>
      <button class="gk-chip" data-chip="10">10</button><button class="gk-chip" data-chip="50">50</button>
      <button class="gk-chip" data-chip="100">100</button>
      <button class="gk-chip" id="gkHalf">&frac12;</button><button class="gk-chip" id="gkDouble">2&times;</button>
    </div>
    <div class="gk-msg" id="gkMsg">Hit spin and chase the 777.</div>
    <button class="gk-bet" id="gkAction">SPIN REELS</button>
    <button class="gk-reset" id="gkReset">Top up demo balance to GH&#8373;1,000</button>
    <div class="gk-history" id="gkHistory"></div>
  </section>
  <p class="gk-foot">Demo game &mdash; plays with fun balance only, no real-money wagering on this static preview. Outcomes are generated in your browser.</p>
</main>
<script src="/game-kit.js"></script>
<script>
(function () {
  var SYMS = [
    { id: "seven",    img: "/game-img/sym-seven.webp",    w: 1, pay: 50 },
    { id: "diamond",  img: "/game-img/sym-diamond.webp",  w: 2, pay: 25 },
    { id: "gem",      img: "/game-img/sym-gem.webp",      w: 3, pay: 15 },
    { id: "bell",     img: "/game-img/sym-bell.webp",     w: 4, pay: 10 },
    { id: "star",     img: "/game-img/sym-star.webp",     w: 4, pay: 8 },
    { id: "lemon",    img: "/game-img/sym-lemon.webp",    w: 5, pay: 5 },
    { id: "cherries", img: "/game-img/sym-cherries.webp", w: 5, pay: 4 }
  ];
  var POOL = [];
  SYMS.forEach(function (s) { for (var i = 0; i < s.w; i++) POOL.push(s); });
  var CELL = 112, spinning = false;
  var reelsEl = document.getElementById("reels");
  var strips = [];
  for (var r = 0; r < 3; r++) {
    var reel = document.createElement("div"); reel.className = "reel";
    var strip = document.createElement("div"); strip.className = "strip";
    strip.innerHTML = '<img src="' + SYMS[r + 2].img + '" alt="">';
    reel.appendChild(strip); reelsEl.appendChild(reel); strips.push(strip);
  }
  document.getElementById("paytable").innerHTML = SYMS.map(function (s) {
    return '<span><img src="' + s.img + '" alt="">Three of a kind</span><b>&times;' + s.pay + '</b>';
  }).join("") + '<span>Any pair on the line</span><b>&times;1.85</b>';

  function drawSym() { return POOL[BB.rand(POOL.length)]; }

  function spin() {
    if (spinning) return;
    var stake = BB.placeBet();
    if (!stake) return;
    spinning = true;
    var btn = document.getElementById("gkAction");
    btn.disabled = true;
    BB.msg("Reels spinning\u2026");
    document.querySelectorAll(".reel").forEach(function (el) { el.classList.remove("win"); });
    var result = [drawSym(), drawSym(), drawSym()];
    var done = 0;
    strips.forEach(function (strip, i) {
      var cells = [];
      for (var k = 0; k < 12 + i * 5; k++) cells.push(drawSym());
      cells.push(result[i]);
      strip.innerHTML = cells.map(function (s) { return '<img src="' + s.img + '" alt="">'; }).join("");
      var dist = (cells.length - 1) * CELL;
      var anim = strip.animate(
        [{ transform: "translateY(0px)", filter: "blur(0px)" },
         { transform: "translateY(-" + Math.round(dist * 0.85) + "px)", filter: "blur(3px)", offset: 0.7 },
         { transform: "translateY(-" + dist + "px)", filter: "blur(0px)" }],
        { duration: 1100 + i * 450, easing: "cubic-bezier(.12,.6,.16,1)", fill: "forwards" });
      anim.onfinish = function () { if (++done === 3) settle(stake, result); };
    });
  }

  function settle(stake, res) {
    spinning = false;
    document.getElementById("gkAction").disabled = false;
    var ids = res.map(function (s) { return s.id; });
    var mult = 0, label = "";
    if (ids[0] === ids[1] && ids[1] === ids[2]) { mult = res[0].pay; label = "Three of a kind!"; }
    else if (ids[0] === ids[1] || ids[1] === ids[2] || ids[0] === ids[2]) { mult = 1.85; label = "A pair!"; }
    var reelEls = document.querySelectorAll(".reel");
    if (mult > 0) {
      var win = BB.settle(stake, mult);
      BB.msg(label + " You won GH\u20B5" + BB.fmt(win) + (mult >= 8 ? " \u2014 big one!" : ""), "win");
      BB.history("+" + BB.fmt(win), "w");
      BB.burst(document.getElementById("stage"));
      if (ids[0] === ids[1]) reelEls[0].classList.add("win");
      reelEls[1].classList.add("win");
      if (ids[1] === ids[2]) reelEls[2].classList.add("win");
    } else {
      BB.msg("No match this time. Spin again.", "lose");
      BB.history("-" + BB.fmt(stake), "l");
    }
    BB.render();
  }

  document.getElementById("gkAction").addEventListener("click", spin);
})();
</script>
</body>
</html>
