<body><header><a href="/gh/casino/index.html">&larr; Casino</a><span class="logo">BLIZ<b>BET</b></span></header>
<main><h1>Turbo Cars</h1><p class="sub">Pick your car and watch the street race. Winner pays 3.80x.</p>
<div class="panel row" style="justify-content:space-between"><span class="bal">Demo balance<br><b id="bal">GH₵ 1,000.00</b></span><span class="row"><input type="number" id="stake" value="10" min="1" step="1"><button class="chip" data-v="1">1</button><button class="chip" data-v="5">5</button><button class="chip" data-v="10">10</button><button class="chip" data-v="50">50</button><button class="chip" data-v="100">100</button></span></div>

<div class="panel row"><select id="pick"><option value="0">Red Rocket</option><option value="1">Blue Bolt</option><option value="2">Green Ghost</option><option value="3">Gold Flash</option></select></div>

<script>
let bal=1000;const $=id=>document.getElementById(id);
function money(n){return 'GH₵ '+n.toFixed(2)}
function render(){$('bal').textContent=money(bal)}
function getStake(){const s=parseFloat($('stake').value)||0;if(s<=0||s>bal){say('Enter a stake within your demo balance.','lose');return 0}return s}
function settle(stake,mult,winMsg,loseMsg){if(mult>0){const w=stake*mult;bal+=w-stake;say(winMsg+' You won '+money(w)+'.','win')}else{bal-=stake;say(loseMsg,'lose')}render()}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('stake').value=c.dataset.v});
function say(t,c){const m=$('msg');if(m){m.textContent=t;m.className='msg '+(c||'')}}
render();
const cars=['\u{1F534} Red Rocket','\u{1F535} Blue Bolt','\u{1F7E2} Green Ghost','\u{1F7E1} Gold Flash'];
function race(){const s=getStake();if(!s)return;const pick=+$('pick').value;const pos=[0,0,0,0];const tr=$('track');tr.innerHTML=cars.map((c,i)=>'<div style="margin:6px 0"><span style="font-size:13px">'+c+'</span><div style="background:#1d1924;border-radius:8px;height:22px"><div id="car'+i+'" style="height:22px;width:2%;border-radius:8px;background:'+['#dc2626','#2563eb','#16a34a','#eab308'][i]+'"></div></div></div>').join('');say('Racing...','');
const t=setInterval(()=>{for(let i=0;i<4;i++){pos[i]+=Math.random()*9;document.getElementById('car'+i).style.width=Math.min(100,pos[i])+'%'}if(Math.max(...pos)>=100){clearInterval(t);const w=pos.indexOf(Math.max(...pos));
if(w==pick)settle(s,3.8,cars[w]+' wins the race - your pick!','');else{bal-=s;say(cars[w]+' wins. Your car came up short.','lose');render()}}},120)}
</script></body></html>
